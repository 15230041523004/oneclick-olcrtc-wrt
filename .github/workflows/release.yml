name: release

# Untested/alpha/rc: every push to main rebuilds that prerelease.
# Stable (VERSION without a suffix): only a pushed v* tag publishes,
# so main commits cannot become GitHub "latest".
on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decide tag and whether to publish
        id: meta
        run: |
          ver="$(tr -d ' \n\r' < VERSION)"
          test -n "$ver"
          tag="v${ver}"
          pre=false
          case "$ver" in
            *-untested*|*-alpha*|*-rc*)
              pre=true
              ;;
          esac

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            test "${GITHUB_REF_NAME}" = "$tag"
            publish=true
          elif [ "$pre" = "true" ]; then
            publish=true
          else
            publish=false
          fi

          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "version=$ver tag=$tag prerelease=$pre publish=$publish"

      - name: Install shellcheck and dash
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck dash

      - name: POSIX syntax
        run: |
          sh -n install.sh
          sh -n uninstall.sh
          sh -n scripts/build-olcrtc.sh
          sh -n scripts/check-installer.sh
          sh -n scripts/prepare-release.sh
          dash -n install.sh
          dash -n uninstall.sh
          dash -n scripts/build-olcrtc.sh
          dash -n scripts/check-installer.sh
          dash -n scripts/prepare-release.sh

      - name: ShellCheck
        run: shellcheck -s sh install.sh uninstall.sh scripts/build-olcrtc.sh scripts/check-installer.sh scripts/prepare-release.sh

      - name: Installer fixtures
        run: sh scripts/check-installer.sh

      - name: Read versions.env
        id: ver
        run: |
          . ./versions.env
          echo "go=$GO_VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$OLCRTC_COMMIT" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        if: steps.meta.outputs.publish == 'true'
        with:
          go-version: ${{ steps.ver.outputs.go }}

      - name: Cross-build linux/arm64 and linux/amd64
        if: steps.meta.outputs.publish == 'true'
        run: sh scripts/build-olcrtc.sh

      - name: Pre-publish gate (ELF both arches + SHA256SUMS)
        if: steps.meta.outputs.publish == 'true'
        run: |
          test -s dist/olcrtc-linux-arm64
          test -s dist/olcrtc-linux-amd64
          test -s dist/SHA256SUMS
          test -s dist/OLCRTC_COMMIT.txt
          grep -qx '${{ steps.ver.outputs.commit }}' dist/OLCRTC_COMMIT.txt
          hex_arm=$(od -An -tx1 -N 4 dist/olcrtc-linux-arm64 | tr -d ' \n\t')
          hex_amd=$(od -An -tx1 -N 4 dist/olcrtc-linux-amd64 | tr -d ' \n\t')
          test "$hex_arm" = "7f454c46"
          test "$hex_amd" = "7f454c46"
          (cd dist && sha256sum -c SHA256SUMS)

      - name: Bake installer to this version tag
        if: steps.meta.outputs.publish == 'true'
        run: sh scripts/prepare-release.sh "${{ steps.meta.outputs.tag }}"

      - name: Publish GitHub Release
        if: steps.meta.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/install.sh
            dist/uninstall.sh
            dist/olcrtc-linux-arm64
            dist/olcrtc-linux-amd64
            dist/SHA256SUMS
            dist/OLCRTC_COMMIT.txt
          body: |
            Pinned upstream: `${{ steps.ver.outputs.commit }}`

            Built with `CGO_ENABLED=0` from `openlibrecommunity/olcrtc` (`./cmd/olcrtc`).
            Install from **this Release**, not from the repo root. One line on the router:

            ```
            wget -O /tmp/olcrtc-install.sh https://github.com/15230041523004/oneclick-olcrtc-wrt/releases/download/${{ steps.meta.outputs.tag }}/install.sh && ROOM_ID='<telemost-room-id>' sh /tmp/olcrtc-install.sh
            ```

            That script downloads `olcrtc-linux-arm64` or `olcrtc-linux-amd64` from these assets.

            Assets: `install.sh`, `uninstall.sh`, `olcrtc-linux-arm64`, `olcrtc-linux-amd64`, `SHA256SUMS`, `OLCRTC_COMMIT.txt`.

            Release GO: these assets + a stable procd start.
            Deployment GO: reboot + phone `curl --socks5-hostname 127.0.0.1:8808`.
