name: ci

on:
  push:
  pull_request:

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck and dash
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck dash

      - name: POSIX syntax
        run: |
          sh -n install.sh
          sh -n uninstall.sh
          sh -n scripts/build-olcrtc.sh
          sh -n scripts/check-installer.sh
          sh -n scripts/prepare-release.sh
          dash -n install.sh
          dash -n uninstall.sh
          dash -n scripts/build-olcrtc.sh
          dash -n scripts/check-installer.sh
          dash -n scripts/prepare-release.sh

      - name: ShellCheck
        run: shellcheck -s sh install.sh uninstall.sh scripts/build-olcrtc.sh scripts/check-installer.sh scripts/prepare-release.sh

      - name: dump-config, dump-uri and dump-systemd fixtures
        run: sh scripts/check-installer.sh

      - name: Isolated OpenWrt/Debian/Ubuntu installer fixtures
        run: python3 scripts/check-platforms.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read versions.env
        id: ver
        run: |
          # shellcheck source=/dev/null
          . ./versions.env
          echo "go=$GO_VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$OLCRTC_COMMIT" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.ver.outputs.go }}

      - name: Cross-build linux/arm64, linux/amd64 and linux/armv7
        run: sh scripts/build-olcrtc.sh

      - name: Install qemu-user-static
        run: sudo apt-get update && sudo apt-get install -y qemu-user-static

      - name: Check release-shaped artifacts
        run: |
          test -s dist/olcrtc-linux-arm64
          test -s dist/olcrtc-linux-amd64
          test -s dist/olcrtc-linux-armv7
          test -s dist/SHA256SUMS
          test -s dist/OLCRTC_COMMIT.txt
          grep -qx '${{ steps.ver.outputs.commit }}' dist/OLCRTC_COMMIT.txt
          (cd dist && sha256sum -c SHA256SUMS)

          hex() { od -An -tx1 "$@" | tr -d ' \n\t'; }
          test "$(hex -N 4 dist/olcrtc-linux-arm64)" = "7f454c46"
          test "$(hex -N 4 dist/olcrtc-linux-amd64)" = "7f454c46"
          test "$(hex -N 4 dist/olcrtc-linux-armv7)" = "7f454c46"
          test "$(hex -j 4 -N 1 dist/olcrtc-linux-arm64)" = "02"
          test "$(hex -j 4 -N 1 dist/olcrtc-linux-amd64)" = "02"
          test "$(hex -j 4 -N 1 dist/olcrtc-linux-armv7)" = "01"
          test "$(hex -j 18 -N 2 dist/olcrtc-linux-arm64)" = "b700"
          test "$(hex -j 18 -N 2 dist/olcrtc-linux-amd64)" = "3e00"
          test "$(hex -j 18 -N 2 dist/olcrtc-linux-armv7)" = "2800"

          go version -m dist/olcrtc-linux-armv7 | grep -q 'GOARCH=arm'
          go version -m dist/olcrtc-linux-armv7 | grep -q 'GOARM=7'

          set +e
          qemu_out=$(qemu-arm-static dist/olcrtc-linux-armv7 2>&1)
          qemu_rc=$?
          set -e
          test "$qemu_rc" -eq 1
          printf '%s\n' "$qemu_out" | grep -qi usage

      - uses: actions/upload-artifact@v4
        with:
          name: olcrtc-linux
          path: |
            dist/olcrtc-linux-arm64
            dist/olcrtc-linux-amd64
            dist/olcrtc-linux-armv7
            dist/SHA256SUMS
            dist/OLCRTC_COMMIT.txt
